name: Legal Agent Daily
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  corsa-ricerca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Esegui Agente
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u script.py
